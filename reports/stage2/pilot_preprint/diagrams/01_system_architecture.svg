<text x="140.0" y="618.0" font-size="11" fill="#52514e" text-anchor="middle">held-out worlds, baselines</text>
<text x="140.0" y="633.0" font-size="11" fill="#52514e" text-anchor="middle">KM, bootstrap CI, Hedges g</text>
