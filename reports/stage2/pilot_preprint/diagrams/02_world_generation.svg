<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="02_world_generation">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6e69"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" fill="#1b1b1a" text-anchor="start" font-weight="600">World generation pipeline</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#52514e" text-anchor="start">A pure function of the seed (default 256×256). Terrain is static afterwards; everything else evolves.</text>
<rect x="20" y="90" width="226" height="76" rx="9" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.6"/>
<text x="133.0" y="117.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">1  Seed</text>
<text x="133.0" y="135.0" font-size="11" fill="#52514e" text-anchor="middle">integer world seed</text>
<text x="133.0" y="150.0" font-size="11" fill="#52514e" text-anchor="middle">train 1000+ · eval 0-4</text>
<rect x="272" y="90" width="226" height="76" rx="9" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="385.0" y="117.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">2  Elevation</text>
<text x="385.0" y="135.0" font-size="11" fill="#52514e" text-anchor="middle">domain-warped fBm</text>
<text x="385.0" y="150.0" font-size="11" fill="#52514e" text-anchor="middle">+ continental falloff</text>
<rect x="524" y="90" width="226" height="76" rx="9" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="637.0" y="117.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">3  Normalise</text>
<text x="637.0" y="135.0" font-size="11" fill="#52514e" text-anchor="middle">rank-normalised heights</text>
<text x="637.0" y="150.0" font-size="11" fill="#52514e" text-anchor="middle">sea / rock / mountain levels</text>
<rect x="776" y="90" width="226" height="76" rx="9" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.6"/>
<text x="889.0" y="117.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">4  Priority-flood</text>
<text x="889.0" y="135.0" font-size="11" fill="#52514e" text-anchor="middle">fill depressions</text>
<text x="889.0" y="150.0" font-size="11" fill="#52514e" text-anchor="middle">(Barnes et al. 2014) → lakes</text>
<rect x="20" y="210" width="226" height="76" rx="9" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.6"/>
<text x="133.0" y="237.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">5  D8 flow accumulation</text>
<text x="133.0" y="255.0" font-size="11" fill="#52514e" text-anchor="middle">rivers ≥ 180 upstream cells</text>
<text x="133.0" y="270.0" font-size="11" fill="#52514e" text-anchor="middle">streams ≥ 90 (dry in drought)</text>
<rect x="272" y="210" width="226" height="76" rx="9" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.6"/>
<text x="385.0" y="237.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">6  Moisture</text>
<text x="385.0" y="255.0" font-size="11" fill="#52514e" text-anchor="middle">noise + distance to</text>
<text x="385.0" y="270.0" font-size="11" fill="#52514e" text-anchor="middle">fresh water</text>
<rect x="524" y="210" width="226" height="76" rx="9" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="637.0" y="237.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">7  Biomes</text>
<text x="637.0" y="255.0" font-size="11" fill="#52514e" text-anchor="middle">water, sand, grass, meadow,</text>
<text x="637.0" y="270.0" font-size="11" fill="#52514e" text-anchor="middle">forest, barren, rock, mountain</text>
<rect x="776" y="210" width="226" height="76" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="889.0" y="237.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">8  Resources</text>
<text x="889.0" y="255.0" font-size="11" fill="#52514e" text-anchor="middle">fertility, wood, caves,</text>
<text x="889.0" y="270.0" font-size="11" fill="#52514e" text-anchor="middle">fruit trees (~1.2% density)</text>
<rect x="20" y="330" width="226" height="76" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="133.0" y="357.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">9  Fauna</text>
<text x="133.0" y="375.0" font-size="11" fill="#52514e" text-anchor="middle">small prey, large prey,</text>
<text x="133.0" y="390.0" font-size="11" fill="#52514e" text-anchor="middle">predators (food-limited)</text>
<rect x="272" y="330" width="226" height="76" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="385.0" y="357.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">10  Spin-up</text>
<text x="385.0" y="375.0" font-size="11" fill="#52514e" text-anchor="middle">1 year of ecology</text>
<text x="385.0" y="390.0" font-size="11" fill="#52514e" text-anchor="middle">without agents</text>
<rect x="524" y="330" width="226" height="76" rx="9" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.6"/>
<text x="637.0" y="357.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">11  Line of sight</text>
<text x="637.0" y="375.0" font-size="11" fill="#52514e" text-anchor="middle">precompute per-cell</text>
<text x="637.0" y="390.0" font-size="11" fill="#52514e" text-anchor="middle">visibility masks</text>
<rect x="776" y="330" width="226" height="76" rx="9" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.6"/>
<text x="889.0" y="357.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">12  Spawn agents</text>
<text x="889.0" y="375.0" font-size="11" fill="#52514e" text-anchor="middle">256 agents on land</text>
<text x="889.0" y="390.0" font-size="11" fill="#52514e" text-anchor="middle">= run tick 0</text>
<path d="M 246.0 128.0 L 272.0 128.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 498.0 128.0 L 524.0 128.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 750.0 128.0 L 776.0 128.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 889.0 166.0 L 889.0 188.0 L 133.0 188.0 L 133.0 210.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 246.0 248.0 L 272.0 248.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 498.0 248.0 L 524.0 248.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 750.0 248.0 L 776.0 248.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 889.0 286.0 L 889.0 308.0 L 133.0 308.0 L 133.0 330.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 246.0 368.0 L 272.0 368.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 498.0 368.0 L 524.0 368.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 750.0 368.0 L 776.0 368.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="24" y="438" width="14" height="14" rx="3" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.4"/>
<text x="44.0" y="449.0" font-size="11" fill="#52514e" text-anchor="start">terrain</text>
<rect x="90.56" y="438" width="14" height="14" rx="3" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.4"/>
<text x="110.6" y="449.0" font-size="11" fill="#52514e" text-anchor="start">hydrology (ocean is salt; fresh water ~4-6% of map)</text>
<rect x="392.85" y="438" width="14" height="14" rx="3" fill="#fdeee7" stroke="#eb6834" stroke-width="1.4"/>
<text x="412.9" y="449.0" font-size="11" fill="#52514e" text-anchor="start">ecology</text>
<rect x="467.33000000000004" y="438" width="14" height="14" rx="3" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.4"/>
<text x="487.3" y="449.0" font-size="11" fill="#52514e" text-anchor="start">setup</text>
</svg>
