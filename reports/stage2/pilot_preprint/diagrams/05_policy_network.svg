<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="05_policy_network">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6e69"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" fill="#1b1b1a" text-anchor="start" font-weight="600">Actor-critic policy (one set of weights shared by all agents)</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#52514e" text-anchor="start">≈1.1M parameters. The memory ablation swaps only the core: GRUCell(256) vs a 256-unit feed-forward layer.</text>
<rect x="20" y="96" width="150" height="62" rx="9" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="95.0" y="123.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">grid</text>
<text x="95.0" y="141.5" font-size="11" fill="#52514e" text-anchor="middle">11 × 11 × 16</text>
<rect x="200" y="96" width="130" height="62" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="265.0" y="123.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">conv 3×3</text>
<text x="265.0" y="141.5" font-size="11" fill="#52514e" text-anchor="middle">32, ReLU</text>
<rect x="360" y="96" width="140" height="62" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="430.0" y="123.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">conv 3×3</text>
<text x="430.0" y="141.5" font-size="11" fill="#52514e" text-anchor="middle">64, stride 2, ReLU</text>
<rect x="530" y="96" width="120" height="62" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="590.0" y="123.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">flatten</text>
<text x="590.0" y="141.5" font-size="11" fill="#52514e" text-anchor="middle">→ FC 256</text>
<rect x="20" y="196" width="150" height="62" rx="9" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="95.0" y="223.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">vector</text>
<text x="95.0" y="241.5" font-size="11" fill="#52514e" text-anchor="middle">13 + 4×9 + 8 = 57</text>
<rect x="200" y="196" width="130" height="62" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="265.0" y="223.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">FC 64</text>
<text x="265.0" y="241.5" font-size="11" fill="#52514e" text-anchor="middle">ReLU</text>
<rect x="680" y="180" width="110" height="62" rx="9" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.6"/>
<text x="735.0" y="207.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">concat</text>
<text x="735.0" y="225.5" font-size="10" fill="#52514e" text-anchor="middle">256 + 64 = 320</text>
<rect x="680" y="290" width="110" height="62" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="735.0" y="317.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">FC 256</text>
<text x="735.0" y="335.5" font-size="11" fill="#52514e" text-anchor="middle">trunk</text>
<rect x="830" y="280" width="220" height="82" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="940.0" y="310.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">core</text>
<text x="940.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle">GRUCell(256)   [memory]</text>
<text x="940.0" y="343.0" font-size="11" fill="#52514e" text-anchor="middle">or MLP 256   [memoryless]</text>
<rect x="830" y="120" width="220" height="56" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="940.0" y="144.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">policy head</text>
<text x="940.0" y="162.5" font-size="11" fill="#52514e" text-anchor="middle">softmax over 11 actions</text>
<rect x="830" y="384" width="220" height="44" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="940.0" y="410.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">value head  V(o, h)</text>
<path d="M 170.0 127.0 L 200.0 127.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 330.0 127.0 L 360.0 127.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 500.0 127.0 L 530.0 127.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 170.0 227.0 L 200.0 227.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 650.0 127.0 L 735.0 127.0 L 735.0 180.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 330.0 227.0 L 680.0 227.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 735.0 242.0 L 735.0 290.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 790.0 321.0 L 830.0 321.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 940.0 280.0 L 940.0 176.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 940.0 362.0 L 940.0 384.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 1050.0 341.0 L 1066.0 341.0 L 1066.0 301.0 L 1050.0 301.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1072.0" y="325.0" font-size="10.5" fill="#52514e" text-anchor="start">h_t</text>
<text x="24.0" y="320.0" font-size="11" fill="#8a8984" text-anchor="start" font-style="italic">h_t is per agent; zeroed when info['born'] marks a new agent in the slot.</text>
<text x="24.0" y="338.0" font-size="11" fill="#8a8984" text-anchor="start" font-style="italic">Grid ÷ 255 on the way in. Network on MPS (~1 ms for 256 agents), world on CPU.</text>
</svg>
