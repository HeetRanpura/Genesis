<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="06_training_loop">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6e69"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" fill="#1b1b1a" text-anchor="start" font-weight="600">Training loop (one iteration ≈ 32k agent-steps)</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#52514e" text-anchor="start">Reward is exactly the environment's homeostatic reward: no social term, no shaping, no curiosity bonus.</text>
<rect x="20" y="100" width="220" height="92" rx="9" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="130.0" y="127.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Training world</text>
<text x="130.0" y="145.5" font-size="11" fill="#52514e" text-anchor="middle">seed 1000 + k</text>
<text x="130.0" y="160.5" font-size="11" fill="#52514e" text-anchor="middle">new world every 40 iterations</text>
<text x="130.0" y="175.5" font-size="11" fill="#52514e" text-anchor="middle">1-year spin-up first</text>
<rect x="290" y="100" width="230" height="92" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="405.0" y="127.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Rollout</text>
<text x="405.0" y="145.5" font-size="11" fill="#52514e" text-anchor="middle">128 ticks × 256 agents</text>
<text x="405.0" y="160.5" font-size="11" fill="#52514e" text-anchor="middle">a ~ π(· | o, h), all in parallel</text>
<text x="405.0" y="175.5" font-size="11" fill="#52514e" text-anchor="middle">reset h where born</text>
<rect x="570" y="100" width="230" height="92" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="685.0" y="127.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Advantages</text>
<text x="685.0" y="145.5" font-size="11" fill="#52514e" text-anchor="middle">GAE  γ 0.995, λ 0.95</text>
<text x="685.0" y="160.5" font-size="11" fill="#52514e" text-anchor="middle">bootstrap cut at death</text>
<text x="685.0" y="175.5" font-size="11" fill="#52514e" text-anchor="middle">(next obs is a newborn)</text>
<rect x="820" y="230" width="220" height="120" rx="9" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="930.0" y="264.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">PPO update</text>
<text x="930.0" y="282.0" font-size="11" fill="#52514e" text-anchor="middle">4 epochs × 4 minibatches</text>
<text x="930.0" y="297.0" font-size="11" fill="#52514e" text-anchor="middle">clip 0.2, value 0.5, ent 0.01</text>
<text x="930.0" y="312.0" font-size="11" fill="#52514e" text-anchor="middle">Adam 3e-4, grad-norm 0.5</text>
<text x="930.0" y="327.0" font-size="11" fill="#52514e" text-anchor="middle">BPTT over the full rollout</text>
<rect x="570" y="260" width="220" height="66" rx="9" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.6"/>
<text x="680.0" y="282.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Checkpoint</text>
<text x="680.0" y="300.0" font-size="11" fill="#52514e" text-anchor="middle">checkpoints/last.pt</text>
<text x="680.0" y="315.0" font-size="11" fill="#52514e" text-anchor="middle">resumable</text>
<rect x="290" y="260" width="230" height="66" rx="9" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.6"/>
<text x="405.0" y="282.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Flight recorder</text>
<text x="405.0" y="300.0" font-size="11" fill="#52514e" text-anchor="middle">obs-free records + value,</text>
<text x="405.0" y="315.0" font-size="11" fill="#52514e" text-anchor="middle">action probs, log-prob</text>
<rect x="570" y="380" width="220" height="92" rx="9" fill="#fdf3dc" stroke="#c98500" stroke-width="1.6"/>
<text x="680.0" y="407.5" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Held-out mini-evaluation</text>
<text x="680.0" y="425.5" font-size="11" fill="#52514e" text-anchor="middle">every 100 iterations</text>
<text x="680.0" y="440.5" font-size="11" fill="#52514e" text-anchor="middle">worlds 0-1, 0.5 yr</text>
<text x="680.0" y="455.5" font-size="11" fill="#52514e" text-anchor="middle">progress only, not claims</text>
<rect x="742.4" y="371" width="41.6" height="17" rx="8.5" fill="#ffffff" stroke="#c98500" stroke-width="1.2"/>
<text x="763.2" y="383.5" font-size="9.5" fill="#52514e" text-anchor="middle">caveat</text>
<path d="M 240.0 146.0 L 290.0 146.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 520.0 146.0 L 570.0 146.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 800.0 146.0 L 930.0 146.0 L 930.0 230.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 820.0 293.0 L 790.0 293.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 680.0 260.0 L 680.0 226.0 L 440.0 226.0 L 440.0 192.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560.0" y="220.0" font-size="10.5" fill="#52514e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next iteration</text>
<path d="M 340.0 192.0 L 340.0 260.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="346.0" y="230.0" font-size="10.5" fill="#52514e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">every k-th rollout</text>
<path d="M 680.0 326.0 L 680.0 380.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="130.0" y="214.0" font-size="11" fill="#8a8984" text-anchor="middle" font-style="italic">when k mod 40 = 0: next seed</text>
<text x="24.0" y="500.0" font-size="11" fill="#8a8984" text-anchor="start" font-style="italic">Pilots: 600 iterations = 19.7M agent-steps, ≈50 min on an M3 Pro (MPS). Replication: 900 iterations × 3 seeds × 2 arms (paused).</text>
</svg>
