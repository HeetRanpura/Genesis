<path d="M 360.0 413.0 L 320.0 413.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="340.0" y="405.0" font-size="10.5" fill="#52514e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text>
<path d="M 640.0 413.0 L 680.0 413.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="660.0" y="405.0" font-size="10.5" fill="#52514e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text>
<path d="M 170.0 446.0 L 170.0 480.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 860.0 446.0 L 860.0 480.0" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
